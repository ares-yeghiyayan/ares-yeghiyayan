<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="600" viewBox="0 0 1400 600" role="img" aria-labelledby="title desc">
  <title id="title">Ares Yeghiyayan profile banner</title>
  <desc id="desc">Founder of Maximilion, proof-driven systems, decision quality, uncertainty, and execution discipline.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05080f"/>
      <stop offset="0.45" stop-color="#071323"/>
      <stop offset="1" stop-color="#02050a"/>
    </linearGradient>
    <radialGradient id="halo" cx="28%" cy="45%" r="42%">
      <stop offset="0" stop-color="#123c63" stop-opacity="0.75"/>
      <stop offset="0.55" stop-color="#071323" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5b1a"/>
      <stop offset="0.35" stop-color="#f2c46d"/>
      <stop offset="0.68" stop-color="#c88a2a"/>
      <stop offset="1" stop-color="#fff0b0"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1400" height="600" fill="url(#bg)"/>
  <rect width="1400" height="600" fill="url(#halo)"/>
  <path d="M0 460 C130 360 155 190 320 80 L405 0 L0 0 Z" fill="#071827" opacity="0.9"/>
  <path d="M0 600 L430 0 L500 0 L90 600 Z" fill="#0d2037" opacity="0.58"/>
  <path d="M0 600 C105 455 125 325 265 180" fill="none" stroke="url(#gold)" stroke-width="1.5" opacity="0.7"/>
  <path d="M22 20 h4 M42 20 h4 M62 20 h4 M82 20 h4 M102 20 h4 M22 40 h4 M42 40 h4 M62 40 h4 M82 40 h4 M102 40 h4 M22 60 h4 M42 60 h4 M62 60 h4 M82 60 h4 M102 60 h4" stroke="#e4ad4f" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
  <circle cx="284" cy="300" r="184" fill="#06101d" stroke="url(#gold)" stroke-width="2.8"/>
  <circle cx="284" cy="300" r="142" fill="none" stroke="#143a5d" stroke-width="34" opacity="0.55"/>
  <text x="284" y="282" text-anchor="middle" font-family="Georgia, serif" font-size="86" fill="url(#gold)">A</text>
  <text x="284" y="350" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" letter-spacing="6" fill="#b8d0ef">ARES</text>
  <circle cx="438" cy="412" r="56" fill="#07111f" stroke="url(#gold)" stroke-width="2.2"/>
  <text x="438" y="430" text-anchor="middle" font-family="Georgia, serif" font-size="58" fill="url(#gold)">M</text>
  <text x="965" y="113" text-anchor="middle" font-family="Georgia, serif" font-size="52" fill="url(#gold)">M</text>
  <line x1="600" y1="110" x2="890" y2="110" stroke="url(#gold)" opacity="0.58"/>
  <line x1="1040" y1="110" x2="1300" y2="110" stroke="url(#gold)" opacity="0.58"/>
  <text x="920" y="230" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="86" fill="#f5f7fb">Ares Yeghiyayan</text>
  <line x1="625" y1="282" x2="770" y2="282" stroke="url(#gold)" opacity="0.6"/>
  <line x1="1070" y1="282" x2="1285" y2="282" stroke="url(#gold)" opacity="0.6"/>
  <text x="920" y="296" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="30" letter-spacing="8" fill="#d8a24a">Founder of <tspan font-weight="700" fill="#f3c56f">Maximilion</tspan></text>
  <text x="920" y="410" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="72" fill="url(#gold)" filter="url(#softGlow)">Proof-Driven Systems</text>
  <line x1="660" y1="440" x2="1180" y2="440" stroke="#f0a83b" stroke-width="1.2" opacity="0.72"/>
  <text x="920" y="498" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="29" fill="#edf3ff" letter-spacing="2">Decision Quality  <tspan fill="#d9a34a">•</tspan>  Uncertainty  <tspan fill="#d9a34a">•</tspan>  Execution Discipline</text>
  <line x1="610" y1="548" x2="785" y2="548" stroke="#315c8f" opacity="0.65"/>
  <line x1="1055" y1="548" x2="1265" y2="548" stroke="#315c8f" opacity="0.65"/>
  <text x="920" y="558" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" letter-spacing="12" fill="#527cad">PUBLIC PROOF SURFACE</text>
</svg>
